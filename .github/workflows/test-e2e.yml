          persist-credentials: false
          # Test:
          #   if: always()
          #   needs: [checkout-trusted, checkout-signed]
          #   runs-on: ubuntu-latest
      # - name: Trusted Checkout
      #   if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      #   uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_V }}
        #   strategy:
        #     matrix:
        #       node-version: [18.x]

        # steps:
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_V }}
      - run: "npm install obsidian \nnpm ci\n"
      - run: npm run build --if-present
      - name: Run Tests
        # - run: npm test

        run: |
          # npm run test
          sudo npm run test-wdio
          sudo npm run test-py
      - name: Set output perms
        if: always()
        run: |
          echo "Current user for this action is - $USER $(id -u)"
          sudo chown -R $(whoami) tests/test_config
          sudo chown -R $(whoami) tests/test_vault

          ls -alh
          ls -alh tests/test_config/
          ls -alh "tests/test_config/.local/share/Anki2/User 1/"
      - name: Package
        if: always()
        run: |
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css README.md ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}
      - name: Publish Test Results in Comment
        uses: EnricoMi/publish-unit-test-result-action@34d7c956a59aed1bfebf31df77b8de55db9bbaaf # v2.21.0
        if: always()
        with:
          report_individual_runs: true
          report_suite_logs: "any"
          deduplicate_classes_by_file_name: true
          comment_title: "🛠 Test Results"
          commit: ${{ github.event.client_payload.pull_request.head.sha }}
          files: |
            logs/test-reports/**/*.xml
      # - name: Publish Test Results
      #   uses: dorny/test-reporter@v1
      #   if: success() || failure()
      #   with:
      #     name: JUnit Reprot
      #     path: logs/test-reports/wdio.xml
      #     reporter: jest-junit
      - uses: iterative/setup-cml@f12ea7685438c1fc438d50f77519b3860cf5fa98 # v2.0.1
        if: always()
      - name: Publish Screenshots - Find Comment
        if: always()
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.client_payload.pull_request.number }}
          body-includes: "# 📷 Screenshots of tests:"
          direction: last
          comment-author: "github-actions[bot]"
      - name: Publish Screenshots - build comment
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GITHUB_EVENT_CLIENT_PAYLOAD_PULL_REQUEST_HEAD_SHA: ${{ github.event.client_payload.pull_request.head.sha }}
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha}}
        shell: bash
        run: "echo \"# 📷 Screenshots of tests:\" >> comment.md\necho \"\" >> comment.md\n\nfor ss_test in logs/**/; do \n  ss_test_desc=$(basename \"$ss_test\" .png)\n  \n  if [ \"$ss_test_desc\" == \"test-reports\" ]; then\n    continue\n  fi\n\n  echo \"\" >> comment.md\n  echo \"### 🔧 $ss_test_desc\" >> comment.md\n  echo \"\" >> comment.md\n\n  echo '<details><summary>Pre Test</summary>' >> comment.md\n\n  for ss in \"$ss_test\"*Pre*.png; do \n    echo '<p float=\"left\">' >> comment.md\n    cml-publish \"$ss\" | sed -E 's/.+/<img width=\"90%\" src=\"\\0\"\\/>/' >> comment.md\n    echo '</p>' >> comment.md\n  done \n  \n  echo '</details><details><summary>Post Test</summary>' >> comment.md\n\n  for ss in \"$ss_test\"*Post*.png; do \n    echo '<p float=\"left\">' >> comment.md\n    cml-publish \"$ss\" | sed -E 's/.+/<img width=\"90%\" src=\"\\0\"\\/>/' >> comment.md\n    echo '</p>' >> comment.md\n  done \n\n  echo '</details>' >> comment.md\ndone\n\n# for ss_test in tests/test_config/*.png logs/*.png; do \n#   ss_test_desc=$(basename \"$ss_test\" .png)\n\n#   # echo \"<details><summary>$ss_test_desc</summary>\" >> comment.md\n#   # echo '<p float=\"left\">' >> comment.md\n#   # cml-publish \"$ss_test\" | sed -E 's/.+/<img width=\"90%\" src=\"\\0\"\\/>/' >> comment.md\n#   # # echo \"![](./$ss_test)\" >> comment.md\n#   # echo '</p></details>' >> comment.md\n\n#   echo \"\" >> comment.md\n#   echo \"### $ss_test_desc\" >> comment.md\n#   echo \"\" >> comment.md\n#   echo '<p float=\"left\">' >> comment.md\n#   cml-publish \"$ss_test\" | sed -E 's/.+/<img width=\"90%\" src=\"\\0\"\\/>/' >> comment.md\n#   # echo \"![](./$ss_test)\" >> comment.md\n#   echo '</p>' >> comment.md\n# done\n\n# if [ \"$EVENT\" == 'pull_request' ]\n# then\nsha=${GITHUB_EVENT_CLIENT_PAYLOAD_PULL_REQUEST_HEAD_SHA}\n# elif [ \"$EVENT\" == 'workflow_run' ]\n# then\n#   sha=${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA}\n# else\n#   sha=$GITHUB_SHA\n# fi\n\necho \"\" >> comment.md\necho \"###### For commit $sha\" >> comment.md\n"
      - name: Publish Screehnshots - Update or Create Comment
